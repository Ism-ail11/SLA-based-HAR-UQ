[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rateless-uq-har"
version = "0.1.0"
description = "Reference implementation of SLA-aware rateless uncertainty packetization for HAR"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.12.0", "pandas==2.2.3", "matplotlib==3.8.4", "Jinja2==3.1.6"]

[project.optional-dependencies]
train = ["torch==2.2.2"]
export = ["torch==2.2.2", "tensorflow-cpu==2.16.2"]
test = ["pytest==8.3.5", "ruff==0.11.13"]
hardware = ["pyserial==3.5"]

[project.scripts]
rateless-har = "rateless_har.cli:main"

[tool.setuptools]
packages = ["rateless_har"]

[tool.setuptools.package-data]
rateless_har = ["default_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
extend-exclude = ["outputs", "__autograph_generated_file*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
